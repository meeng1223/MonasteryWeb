      // Page language from the URL prefix, set before first paint (fonts/zoom use
      // the lang-* class). Same prefixes as src/lib/langs.js.
      (function () {
        var m = { vi: ["vi", "vi"], "zh-hk": ["zh-HK", "zh"], hi: ["hi", "hi"], bo: ["bo", "bo tib"], or: ["or", "or"] };
        var l = m[(location.pathname.split("/")[1] || "").toLowerCase()] || ["en", "en"];
        var h = document.documentElement;
        h.lang = l[0];
        h.className = h.className.replace(/(^|\s)lang-\S+/g, "").trim();
        l[1].split(" ").forEach(function (c) { h.classList.add("lang-" + c); });
      })();
    </script>

    <style>
      /* ── Tibetan typography (single knob) ──────────────────────────
         Change --tib-scale to resize ALL Tibetan text app-wide. */
      :root { --tib-scale: 1.22; }
      html.lang-or body { font-family: "Noto Sans Oriya", "Work Sans", sans-serif; }
      html.lang-hi body { font-family: "Noto Sans Devanagari", "Work Sans", sans-serif; }
      html.lang-zh body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Work Sans", sans-serif; }
      html:is(.lang-or, .lang-hi, .lang-zh, .lang-vi) .uppercase { letter-spacing: normal; }
      html.lang-tib body { font-family: "Noto Serif Tibetan", "Noto Serif", serif; line-height: 1.9; }
      /* Enlarge only text-bearing leaf elements (keeps design proportions,
         leaves images/icons untouched, no compounding). */
      html.lang-tib :where(p,span,a,li,button,label,td,th,h1,h2,h3,h4,h5,h6,strong,em,b,small,blockquote,address,figcaption,dt,dd,div):not(:has(*)):not(.material-symbols-outlined):not(.ti) {
        zoom: var(--tib-scale);
      }
      /* Icon fonts keep their own family in Tibetan mode (each set needs its own font,
         otherwise Tabler icons render as unrelated Material Symbols glyphs). */
      html.lang-tib .material-symbols-outlined { font-family: "Material Symbols Outlined" !important; zoom: 1; }
      html.lang-tib .ti, html.lang-tib .ti::before { font-family: "tabler-icons" !important; zoom: 1; }
    </style>
